services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - composer-cache:/tmp/composer-cache
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      SERVER_HOST: 0.0.0.0
      LINKY_TOKEN: ${LINKY_TOKEN:-}
      LINKY_PRM: ${LINKY_PRM:-}
      LINKY_BASE_URL: ${LINKY_BASE_URL:-https://conso.boris.sh}
      LINKY_TIMEOUT: ${LINKY_TIMEOUT:-15}
      LINKY_USER_AGENT: ${LINKY_USER_AGENT:-stefanpost/laralinky}
    ports:
      - "${APP_PORT:-8000}:8000"
    command:
      - sh
      - -lc
      - >-
        if [ ! -x vendor/bin/testbench ]; then
          COMPOSER_NO_INTERACTION=1 composer install;
        fi;
        composer serve

volumes:
  composer-cache:
